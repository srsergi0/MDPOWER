# Gruvbox Dark — tema de la comunidad MDPOWER
# Copia esta carpeta a %APPDATA%/MDPOWER/themes/ (Windows) o ~/.config/MDPOWER/themes/ (Linux)
# y aparecerá en el menú de temas. Ver themes/COMO-CREAR-TEMA.md

[meta]
id = "gruvbox-dark"
name = "Gruvbox Dark"
mode = "dark"
author = "MDPOWER"
version = "1.0.0"

# Paleta base estilo Omarchy: fuente única de verdad
[colors]
background = "#282828"
foreground = "#ebdbb2"
accent = "#fe8019"
muted = "#928374"
darker_background = "#1d2021"

# UI estilo VSCode workbench (puedes usar {background}, {foreground}, {accent}, {muted})
[ui]
bg-editor = "#282828"
bg-sidebar = "#1d2021"
bg-header = "#32302f"
text-main = "#ebdbb2"
text-muted = "#928374"
border-main = "#3c3836"
accent-blue = "#fe8019"
accent-hover = "rgba(254, 128, 25, 0.15)"

# Cómo renderiza el Markdown, no solo colores
[markdown.h1]
size = "2em"
weight = "800"
color = "{foreground}"
border-bottom = "2px solid {accent}"

[markdown.h2]
size = "1.5em"
weight = "700"
color = "{accent}"

[markdown.h3]
size = "1.2em"
weight = "700"
color = "{foreground}"

[markdown.code]
bg = "{darker_background}"
radius = "8px"

[markdown.blockquote]
border-left = "4px solid {accent}"
italic = "true"

[markdown.a]
color = "{accent}"
underline = "true"
