# One Light — tema de la comunidad MDPOWER
# Copia esta carpeta a %APPDATA%/MDPOWER/themes/ (Windows) o ~/.config/MDPOWER/themes/ (Linux)
# y aparecerá en el menú de temas. Ver themes/COMO-CREAR-TEMA.md

[meta]
id = "one-light"
name = "One Light"
mode = "light"
author = "MDPOWER"
version = "1.0.0"

# Paleta base estilo Omarchy: fuente única de verdad
[colors]
background = "#fafafa"
foreground = "#383a42"
accent = "#4078f2"
muted = "#a0a1a7"
darker_background = "#f0f0f0"

# UI estilo VSCode workbench (puedes usar {background}, {foreground}, {accent}, {muted})
[ui]
bg-editor = "#fafafa"
bg-sidebar = "#f0f0f0"
bg-header = "#e5e5e6"
text-main = "#383a42"
text-muted = "#a0a1a7"
border-main = "#e5e5e6"
accent-blue = "#4078f2"
accent-hover = "rgba(64, 120, 242, 0.08)"

# Cómo renderiza el Markdown, no solo colores
[markdown.h1]
size = "2em"
weight = "800"
color = "{foreground}"
border-bottom = "2px solid {accent}"

[markdown.h2]
size = "1.5em"
weight = "700"
color = "{accent}"

[markdown.h3]
size = "1.2em"
weight = "700"
color = "{foreground}"

[markdown.code]
bg = "{darker_background}"
radius = "8px"

[markdown.blockquote]
border-left = "4px solid {accent}"
italic = "true"

[markdown.a]
color = "{accent}"
underline = "true"
