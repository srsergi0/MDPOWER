# One Dark Pro — tema de la comunidad MDPOWER
# Copia esta carpeta a %APPDATA%/MDPOWER/themes/ (Windows) o ~/.config/MDPOWER/themes/ (Linux)
# y aparecerá en el menú de temas. Ver themes/COMO-CREAR-TEMA.md

[meta]
id = "one-dark"
name = "One Dark Pro"
mode = "dark"
author = "MDPOWER"
version = "1.0.0"

# Paleta base estilo Omarchy: fuente única de verdad
[colors]
background = "#282c34"
foreground = "#abb2bf"
accent = "#61afef"
muted = "#5c6370"
darker_background = "#21252b"

# UI estilo VSCode workbench (puedes usar {background}, {foreground}, {accent}, {muted})
[ui]
bg-editor = "#282c34"
bg-sidebar = "#21252b"
bg-header = "#1e2227"
text-main = "#abb2bf"
text-muted = "#5c6370"
border-main = "#181a1f"
accent-blue = "#61afef"
accent-hover = "rgba(97, 175, 239, 0.15)"

# Cómo renderiza el Markdown, no solo colores
[markdown.h1]
size = "2em"
weight = "800"
color = "{foreground}"
border-bottom = "2px solid {accent}"

[markdown.h2]
size = "1.5em"
weight = "700"
color = "{accent}"

[markdown.h3]
size = "1.2em"
weight = "700"
color = "{foreground}"

[markdown.code]
bg = "{darker_background}"
radius = "8px"

[markdown.blockquote]
border-left = "4px solid {accent}"
italic = "true"

[markdown.a]
color = "{accent}"
underline = "true"
