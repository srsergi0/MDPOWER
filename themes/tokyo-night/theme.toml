# Tokyo Night — tema de la comunidad MDPOWER
# Copia esta carpeta a %APPDATA%/MDPOWER/themes/ (Windows) o ~/.config/MDPOWER/themes/ (Linux)
# y aparecerá en el menú de temas. Ver themes/COMO-CREAR-TEMA.md

[meta]
id = "tokyo-night"
name = "Tokyo Night"
mode = "dark"
author = "MDPOWER"
version = "1.0.0"

# Paleta base estilo Omarchy: fuente única de verdad
[colors]
background = "#1a1b26"
foreground = "#a9b1d6"
accent = "#7aa2f7"
muted = "#565f89"
darker_background = "#16161e"

# UI estilo VSCode workbench (puedes usar {background}, {foreground}, {accent}, {muted})
[ui]
bg-editor = "#1a1b26"
bg-sidebar = "#16161e"
bg-header = "#1f2335"
text-main = "#a9b1d6"
text-muted = "#565f89"
border-main = "#24283b"
accent-blue = "#7aa2f7"
accent-hover = "rgba(122, 162, 247, 0.15)"

# Cómo renderiza el Markdown, no solo colores
[markdown.h1]
size = "2.2em"
weight = "800"
color = "{foreground}"
border-bottom = "2px solid {accent}"

[markdown.h2]
size = "1.5em"
weight = "700"
color = "{accent}"

[markdown.h3]
size = "1.2em"
weight = "700"
color = "{foreground}"

[markdown.code]
bg = "{darker_background}"
radius = "8px"

[markdown.blockquote]
border-left = "4px solid {accent}"
italic = "true"

[markdown.a]
color = "{accent}"
underline = "true"
